### Mihomo_A - 2026-09 更新版
### 适配当前 Mihomo v1.19.x+ 配置格式
### 主要更新：移除废弃全局 TLS 指纹、修复转义引号、重构 DNS、修正规则集 behavior

### 全局配置
mixed-port: 7897
allow-lan: true
mode: rule
log-level: warning
ipv6: false
find-process-mode: strict

profile:
  store-selected: true
  store-fake-ip: true

unified-delay: true
tcp-concurrent: true

### Hosts
hosts:
  'localhost': 127.0.0.1
  'router.local': 192.168.1.1

### DNS 配置
dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: false
  prefer-h3: false
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist

  use-hosts: true
  use-system-hosts: true
  respect-rules: false

  # 用于解析 DNS 服务器自身域名，只能使用 IP 或可直接引导的 DNS。
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 仅用于解析代理节点域名。
  # 使用国内 DNS，避免代理节点域名解析形成“先有代理还是先有 DNS”的循环依赖。
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://119.29.29.29/dns-query
    - https://doh.pub/dns-query

  # DIRECT 出站使用国内 DNS。
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://119.29.29.29/dns-query
  direct-nameserver-follow-policy: false

  # 默认 DNS 用国外 DNS，并显式通过“国外策略”连接，降低 DNS 污染风险。
  nameserver:
    - 'https://1.1.1.1/dns-query#国外策略'
    - 'https://8.8.8.8/dns-query#国外策略'

  # 国内和私有域名优先走国内 DNS。
  # 注意：Mihomo 当前仍支持 '+.domain.com' 语法，不能错误地全量替换成 '*.domain.com'。
  nameserver-policy:
    'geosite:cn,private':
      - https://223.5.5.5/dns-query
      - https://119.29.29.29/dns-query
    '+.cn':
      - https://223.5.5.5/dns-query
      - https://119.29.29.29/dns-query

  # 不分配 Fake-IP 的域名。
  fake-ip-filter:
    # 局域网 / 本地域名
    - '*.lan'
    - '*.local'
    - '*.localdomain'
    - 'localhost'

    # STUN / TURN / WebRTC
    - 'stun.*.*'
    - 'stun.*.*.*'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - 'turn.*.*'
    - 'turn.*.*.*'
    - '+.turn.*.*'
    - '+.turn.*.*.*'
    - 'webrtc.*.*'
    - 'webrtc.*.*.*'
    - '+.webrtc.*.*'
    - '+.webrtc.*.*.*'

    # 时间同步
    - 'time.*.com'
    - 'ntp.*.com'
    - '+.pool.ntp.org'
    - '+.ntp.org.cn'

### 域名嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - dlg.io.mi.com
    - '+.push.apple.com'

### TUN 配置
tun:
  enable: true
  device: meta
  stack: mixed
  dns-hijack:
    - 'any:53'
    - 'tcp://any:53'
  udp-timeout: 300
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  strict-route: true

