### 策略组
proxy-groups:
  # === 基础节点分组 ===
  - {name: 国内策略, type: select, url: 'https://cp.cloudflare.com/generate_204', interval: 300, lazy: false, proxies: [国内自动选择, 国内手动选择, 国内倍率自动, 国内倍率手动, DIRECT]}
  - {name: 国内自动选择, <<: *Auto, filter: *FilterCN}
  - {name: 国内手动选择, <<: *Select, filter: *FilterCN}

  - {name: 国外策略, type: select, url: 'https://cp.cloudflare.com/generate_204', interval: 300, lazy: false, proxies: [国外自动选择, 国外手动选择, 国外倍率自动, 国外倍率手动, DIRECT]}
  - {name: 国外自动选择, <<: *Auto, filter: *FilterGlobal}
  - {name: 国外手动选择, <<: *Select, filter: *FilterGlobal}

  # === 倍率节点分组 ===
  - {name: 国内倍率自动, <<: *Auto, filter: *FilterCN_Multiplier}
  - {name: 国内倍率手动, <<: *Select, filter: *FilterCN_Multiplier}
  - {name: 国外倍率自动, <<: *Auto, filter: *FilterGlobal_Multiplier}
  - {name: 国外倍率手动, <<: *Select, filter: *FilterGlobal_Multiplier}

  # 独立策略
  - {name: 独立策略, type: select, url: 'https://cp.cloudflare.com/generate_204', interval: 300, lazy: false, proxies: [国内自动选择, 国内手动选择, 国外自动选择, 国外手动选择, 国内倍率自动, 国内倍率手动, 国外倍率自动, 国外倍率手动, DIRECT]}

  # === 负载均衡相关 ===
  - {name: 负载均衡(轮询), type: load-balance, url: 'https://cp.cloudflare.com/generate_204', interval: 300, strategy: round-robin, lazy: false, proxies: [国内自动选择, 国外自动选择, 国内倍率自动, 国外倍率自动]}
  - {name: 负载均衡(一致哈希), type: load-balance, url: 'https://cp.cloudflare.com/generate_204', interval: 300, strategy: consistent-hashing, lazy: false, proxies: [国内自动选择, 国外自动选择, 国内倍率自动, 国外倍率自动]}
  - {name: 负载均衡(粘滞会话), type: load-balance, url: 'https://cp.cloudflare.com/generate_204', interval: 300, strategy: sticky-sessions, lazy: false, proxies: [国内自动选择, 国外自动选择, 国内倍率自动, 国外倍率自动]}

  # === 自动回退 ===
  - {name: 故障转移-国内, type: fallback, url: 'https://cp.cloudflare.com/generate_204', interval: 300, lazy: false, proxies: [国内自动选择, 国内倍率自动]}
  - {name: 故障转移-国外, type: fallback, url: 'https://cp.cloudflare.com/generate_204', interval: 300, lazy: false, proxies: [国外自动选择, 国外倍率自动]}

  # === 应用策略组 ===
  - {name: 📘 GitHub, type: select, proxies: [国外策略, 国内策略]}
  - {name: 🙋 Telegram, type: select, proxies: [国外策略]}
  - {name: 🕊️ Twitter(X), type: select, proxies: [国外策略]}
  - {name: 🗣️ Facebook, type: select, proxies: [国外策略]}
  - {name: 🌳 Amazon, type: select, proxies: [国外策略, 国内策略]}
  - {name: 🍎 Apple, type: select, proxies: [国外策略, 国内策略]}
  - {name: Ⓜ️ Microsoft, type: select, proxies: [国外策略, 国内策略]}
  - {name: 🎮 Steam, type: select, proxies: [国外策略, 国内策略]}
  - {name: 🕹️ Game (Epic), type: select, proxies: [国外策略, 国内策略]}
  - {name: 🕹️ Game (EA), type: select, proxies: [国外策略, 国内策略]}
  - {name: 🎞️ YouTube, type: select, proxies: [国外策略]}
  - {name: 🇬🇴 Google, type: select, proxies: [国外策略, 国内策略]}
  - {name: ➡️ 国内, type: select, proxies: [国内策略]}
  - {name: 🌍 国外, type: select, proxies: [国外策略]}
  - {name: 🔒 隐私, type: select, proxies: [REJECT, 国内策略, 国外策略]}
  - {name: 🐟 漏网之鱼, type: select, proxies: [国外策略, 国内策略, 独立策略, DIRECT]}

### 规则集定义
rule-anchor:
  # YAML 格式
  classical_yaml: &classical_yaml {type: http, behavior: classical, interval: 86400, format: yaml, proxy: 国外策略}
  domain_yaml: &domain_yaml {type: http, behavior: domain, interval: 86400, format: yaml, proxy: 国外策略}
  ip_yaml: &ip_yaml {type: http, behavior: ipcidr, interval: 86400, format: yaml, proxy: 国外策略}

  # 文本格式
  classical_text: &classical_text {type: http, behavior: classical, interval: 86400, format: text, proxy: 国外策略}
  domain_text: &domain_text {type: http, behavior: domain, interval: 86400, format: text, proxy: 国外策略}
  ip_text: &ip_text {type: http, behavior: ipcidr, interval: 86400, format: text, proxy: 国外策略}

### 分流规则
rules:
  - RULE-SET,GitHub,📘 GitHub
  - RULE-SET,Telegram,🙋 Telegram
  - RULE-SET,Twitter,🕊️ Twitter(X)
  - RULE-SET,Facebook,🗣️ Facebook
  - RULE-SET,YouTube,🎞️ YouTube
  - RULE-SET,Amazon,🌳 Amazon
  - RULE-SET,Apple,🍎 Apple
  - RULE-SET,Microsoft,Ⓜ️ Microsoft
  - RULE-SET,Google,🇬🇴 Google
  - RULE-SET,Steam,🎮 Steam
  - RULE-SET,Epic,🕹️ Game (Epic)
  - RULE-SET,EA,🕹️ Game (EA)
  - OR,((RULE-SET,ChinaMaxNoIP_Domain),(RULE-SET,ChinaMaxNoIP)),➡️ 国内
  - RULE-SET,Privacy,🔒 隐私
  - RULE-SET,ChinaIPs_Classical_No_IPv6_No_Resolve,➡️ 国内,no-resolve
  - OR,((RULE-SET,Global),(RULE-SET,Global_Domain)),🌍 国外
  - MATCH,🐟 漏网之鱼

