### Mihomo_A - 2026-09 MRS + Classical 混合规则版
### 目标：Android / Windows / macOS / Linux 共用核心配置
### 规则架构：MetaCubeX MRS 承担大规模 domain/ipcidr；Classical 仅保留复杂隐私兜底规则

### 全局配置
mixed-port: 7897
allow-lan: true
mode: rule
log-level: warning
ipv6: false
find-process-mode: strict  # 桌面端保留进程匹配；路由器场景才建议 off

profile:
  store-selected: true
  store-fake-ip: true

unified-delay: true
tcp-concurrent: true

### Hosts
hosts:
  'localhost': 127.0.0.1
  'router.local': 192.168.1.1

### DNS 配置
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  prefer-h3: false
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist

  use-hosts: true
  use-system-hosts: true
  respect-rules: false

  # 用于解析 DNS 服务器自身域名，只能使用 IP 或可直接引导的 DNS。
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 仅用于解析代理节点域名。
  # 使用国内 DNS，避免代理节点域名解析形成“先有代理还是先有 DNS”的循环依赖。
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://119.29.29.29/dns-query
    - https://doh.pub/dns-query

  # DIRECT 出站使用国内 DNS。
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://119.29.29.29/dns-query
  direct-nameserver-follow-policy: false

  # 默认 DNS 用国外 DNS，并显式通过“国外策略”连接，降低 DNS 污染风险。
  nameserver:
    - 'https://1.1.1.1/dns-query#国外策略'
    - 'https://8.8.8.8/dns-query#国外策略'

  # 国内和私有域名优先走国内 DNS。
  # 注意：Mihomo 当前仍支持 '+.domain.com' 语法，不能错误地全量替换成 '*.domain.com'。
  nameserver-policy:
    'rule-set:cn_domain,private_domain':
      - https://223.5.5.5/dns-query
      - https://119.29.29.29/dns-query
    '+.cn':
      - https://223.5.5.5/dns-query
      - https://119.29.29.29/dns-query

  # 不分配 Fake-IP 的域名。
  fake-ip-filter:
    # MRS 私有域名集合 + 本地通配兜底
    - 'rule-set:private_domain'
    # 局域网 / 本地域名
    - '*.lan'
    - '*.local'
    - '*.localdomain'
    - 'localhost'

    # STUN / TURN / WebRTC
    - 'stun.*.*'
    - 'stun.*.*.*'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - 'turn.*.*'
    - 'turn.*.*.*'
    - '+.turn.*.*'
    - '+.turn.*.*.*'
    - 'webrtc.*.*'
    - 'webrtc.*.*.*'
    - '+.webrtc.*.*'
    - '+.webrtc.*.*.*'

    # 时间同步
    - 'time.*.com'
    - 'ntp.*.com'
    - '+.pool.ntp.org'
    - '+.ntp.org.cn'

### 域名嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - dlg.io.mi.com
    - '+.push.apple.com'

### TUN 配置
tun:
  enable: true
  stack: mixed
  dns-hijack:
    - 'any:53'
    - 'tcp://any:53'
  udp-timeout: 300
  auto-route: true
  # Linux / Android 可利用 auto-redirect；Windows / macOS 不依赖此项。
  # 保留该字段可让同一份配置在支持的平台获得优化，而不固定平台网卡名。
  auto-redirect: true
  auto-detect-interface: true
  # Windows 可抑制多宿主 DNS 泄漏；Android 同样有利于 DNS 劫持。
  # 若 Windows 上 VirtualBox/特殊虚拟网卡冲突，可单独改为 false。
  strict-route: true

