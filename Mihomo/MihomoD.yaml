### MihomoD - 2026-10-04 主动测速 / 严格节点分组版
### 目标：Android / Windows / macOS / Linux 共用核心配置
### 规则架构：MetaCubeX MRS 承担大规模 domain/ipcidr；Classical 保留隐私规则
### 本文件与原文件一样是核心模板，不含真实节点；请由客户端合并订阅，或填写下方 provider 示例。
### DNS 由客户端管理；本模板不定义 DNS 上游、解析模式或缓存策略。
### IPv4 基线：若节点仅支持 IPv6，须结合实际 IPv6/TUN 网络单独调整，不能通用地强开。
### proxy-providers 的健康检查需自行配置；默认按需检测，地区自动组负责主动检测。
### 单一测试目标的可达性不等于所有网站可达；配置无法消除上游故障、网络限制或应用自身故障。

### 全局配置
mixed-port: 7897
allow-lan: false
mode: rule
log-level: warning
ipv6: false
find-process-mode: strict  # 桌面端保留进程匹配；路由器场景才建议 off

profile:
  store-selected: true

unified-delay: true
tcp-concurrent: true

### Hosts
hosts:
  'localhost': 127.0.0.1
  # 不预设 router.local 的地址；需要静态映射时填写自己路由器的真实 LAN 地址。

### 域名嗅探
sniffer:
  enable: true
  # 使用可识别的域名连接目标，避免异常解析地址继续作为代理目的地。
  override-destination: true
  parse-pure-ip: true
  force-dns-mapping: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
      override-destination: true
    QUIC:
      ports: [443, 8443]
      override-destination: true
  skip-domain:
    - dlg.io.mi.com
    - '+.push.apple.com'

### TUN 配置
tun:
  enable: true
  stack: mixed
  # 避免采用巨帧默认值；特殊链路仍需按实际 MTU 调整。
  mtu: 1500
  dns-hijack:
    - 'any:53'
    - 'tcp://any:53'
  udp-timeout: 300
  auto-route: true
  # Linux / Android 可利用 auto-redirect；Windows / macOS 不依赖此项。
  # 保留该字段可让同一份配置在支持的平台获得优化，而不固定平台网卡名。
  auto-redirect: true
  auto-detect-interface: true
  # Windows 可抑制多宿主 DNS 泄漏；Android 同样有利于 DNS 劫持。
  # 若 Windows 上 VirtualBox/特殊虚拟网卡冲突，可单独改为 false。
  strict-route: true

### 订阅健康检查默认值
# 如果使用 proxy-providers，每个实际 provider 都应继承此模板或写入相同 health-check。
# 客户端动态注入的 provider 不会自动继承它，需要在客户端覆写其 health-check。
NodeParam: &NodeParam
  type: http
  interval: 86400
  health-check:
    enable: true
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    timeout: 10000
    lazy: true
    expected-status: '204'

# 原文件没有订阅地址；按实际情况启用，勿把占位链接当作有效订阅。
# proxy-providers:
#   订阅1:
#     <<: *NodeParam
#     url: '填入你的真实订阅地址'
#     path: ./proxy_provider/provider1.yaml
#     proxy: DIRECT

### 节点筛选
# 国内只匹配明确的国家标签；CN2、BGP、中转、自建不代表出口在中国大陆。
# CN 后接汉字时不存在 Unicode 单词边界；使用 ASCII 标签边界，同时避免将 CN2 当作国内标签。
# 国外须有明确地区标签；缺标签节点仅出现在“全部”组。
FilterInfo: &FilterInfo '(?i)剩余流量|距离下次重置|套餐到期|过期|https?://|(?:官网|客服|订阅地址|返利|邀请|套餐|重置|公告|通知|群组|电报群|工单|频道)\s*[:：@]|^建议\s*[:：]|^没网更新订阅|^[-=]{2,}'
# 所有节点组统一通过 exclude-filter 排除提示条目，避免两份排除规则不同步。
FilterAll: &FilterAll '.*'
FilterGlobal: &FilterGlobal '^(?=.*(?:香港|澳门|台湾|日本|韩国|新加坡|美国|英国|德国|法国|荷兰|印度|罗马|悉尼|澳大利亚|澳洲|加拿大|俄罗斯|土耳其|巴西|阿根廷|南非|泰国|越南|菲律宾|马来西亚|印尼|印度尼西亚|瑞士|瑞典|挪威|芬兰|丹麦|意大利|西班牙|葡萄牙|波兰|乌克兰|以色列|阿联酋|迪拜|新西兰|墨西哥|爱尔兰|奥地利|比利时|捷克|匈牙利|罗马尼亚|希腊|冰岛|卢森堡|柬埔寨|缅甸|巴基斯坦|孟加拉|尼泊尔|斯里兰卡|沙特|埃及|尼日利亚|肯尼亚|智利|秘鲁|哥伦比亚|🇭🇰|🇲🇴|🇹🇼|🇯🇵|🇰🇷|🇸🇬|🇺🇸|🇬🇧|🇩🇪|🇫🇷|🇳🇱|🇨🇦|🇦🇺|🇮🇳|(?i:(?<![A-Za-z0-9])(?:HK|Hong[ -]?Kong|MO|Macau|Macao|TW|Taiwan|JP|Japan|KR|Korea|SG|Singapore|US|USA|United[ -]?States|UK|GB|Britain|United[ -]?Kingdom|DE|Germany|FR|France|NL|Netherlands|IN|India|AU|Australia|CA|Canada|RU|Russia|TR|Turkey|BR|Brazil|TH|Thailand|VN|Vietnam|PH|Philippines|MY|Malaysia|ID|Indonesia|CH|Switzerland|SE|Sweden|NO|Norway|FI|Finland|DK|Denmark|IT|Italy|ES|Spain|PT|Portugal|PL|Poland|NZ|New[ -]?Zealand|AE|UAE|Dubai|IE|Ireland|AT|Austria|BE|Belgium|CZ|Czech)(?![A-Za-z0-9]))))(?!.*(?:中国|大陆|🇨🇳|(?i:(?<![A-Za-z0-9])(?:CN|China|Mainland)(?![A-Za-z0-9]))))(?!.*(?:[xX×✕*]\s*\d+(?:\.\d+)?|\d+(?:\.\d+)?\s*[xX×✕]|\d+(?:\.\d+)?\s*倍|倍率)).*$'
