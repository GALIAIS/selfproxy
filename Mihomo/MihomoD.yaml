### MihomoC - 2026-10-04 主动测速 / DNS 稳定性修订版
### 目标：Android / Windows / macOS / Linux 共用核心配置
### 规则架构：MetaCubeX MRS 承担大规模 domain/ipcidr；Classical 保留隐私规则
### 本文件与原文件一样是核心模板，不含真实节点；请由客户端合并订阅，或填写下方 provider 示例。
### 保留旧策略选择时：国内策略/隐私切 DIRECT，国外策略切“国外自动兜底”。
### IPv4 基线：若节点仅支持 IPv6，须结合实际 IPv6/TUN 网络单独调整，不能通用地强开。
### proxy-providers 的定时检测由 provider 自身管理：合并后必须同时检查 health-check.lazy=false。
### 单一测试目标的可达性不等于所有网站可达；配置无法消除上游故障、网络限制或应用自身故障。

### 全局配置
mixed-port: 7897
allow-lan: true
mode: rule
log-level: warning
ipv6: false
find-process-mode: strict  # 桌面端保留进程匹配；路由器场景才建议 off

profile:
  store-selected: true
  store-fake-ip: true

unified-delay: true
tcp-concurrent: true

### Hosts
hosts:
  'localhost': 127.0.0.1
  # 不预设 router.local 的地址；需要静态映射时填写自己路由器的真实 LAN 地址。

### DNS 配置
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  prefer-h3: false
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist

  use-hosts: true
  use-system-hosts: true
  respect-rules: false

  # 国内加密 DNS 显式直连，节点域名解析不依赖任何代理组。
  # bootstrap 只用于解析 DoH 服务器域名；保留两个 IP 引导源。
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  proxy-server-nameserver: &DomesticDNS
    - 'https://223.5.5.5/dns-query#DIRECT'
    - 'https://doh.pub/dns-query#DIRECT'

  # 遵循域名策略，使私有域名走本地解析、显式海外域名走可信解析。
  direct-nameserver: *DomesticDNS
  direct-nameserver-follow-policy: true

  # 独立自动组不受“国外策略”手动选择影响；IP 形式的 DoH 无需再解析服务器域名。
  nameserver:
    - 'https://1.1.1.1/dns-query#DNS自动选择'
    - 'https://8.8.8.8/dns-query#DNS自动选择'

  nameserver-policy:
    # 私有域名不能交给公网 DNS。系统 DNS 必须是实际 LAN DNS，不能指回本配置监听端口。
    # 若客户端把 system 指向 Mihomo 自身，将此处 system 改为真实 LAN DNS 地址。
    'rule-set:private_domain': system
    '+.lan': system
    '+.local': system
    '+.localdomain': system
    '+.internal': system
    '+.home.arpa': system
    # 更新规则所需域名不依赖尚未加载的 cn_domain 集合或国外代理组。
    '+.jsdelivr.net': *DomesticDNS
    '+.doh.pub': *DomesticDNS
    '+.alidns.com': *DomesticDNS
    '+.baidu.com': *DomesticDNS
    'dns.msftncsi.com': *DomesticDNS
    'www.msftncsi.com': *DomesticDNS
    'www.msftconnecttest.com': *DomesticDNS
    'rule-set:cn_domain': *DomesticDNS
    '+.cn': *DomesticDNS

  # 不分配 Fake-IP 的域名。
  fake-ip-filter:
    # MRS 私有域名集合 + 本地通配兜底
    - 'rule-set:private_domain'
    # 局域网 / 本地域名
    - '+.lan'
    - '+.local'
    - '+.localdomain'
    - '+.internal'
    - '+.home.arpa'
    - 'localhost'

    # STUN / TURN / WebRTC
    - 'stun.*.*'
    - 'stun.*.*.*'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - 'turn.*.*'
    - 'turn.*.*.*'
    - '+.turn.*.*'
    - '+.turn.*.*.*'
    - 'webrtc.*.*'
    - 'webrtc.*.*.*'
    - '+.webrtc.*.*'
    - '+.webrtc.*.*.*'

    # 联网检查 / 游戏主机 / 局域网发现需要真实地址
    - 'dns.msftncsi.com'
    - 'www.msftconnecttest.com'
    - 'www.msftncsi.com'
    - '*.srv.nintendo.net'
    - '*.stun.playstation.net'
    - 'xbox.*.microsoft.com'
    - '*.xboxlive.com'
    - 'lancache.steamcontent.com'
    - '+.market.xiaomi.com'

    # 时间同步
    - 'time.*.com'
    - 'ntp.*.com'
    - '+.pool.ntp.org'
    - '+.ntp.org.cn'

### 域名嗅探
sniffer:
  enable: true
  # 嗅探用于分流，不强制将既定连接目标重写为嗅探域名。
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: false
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - dlg.io.mi.com
    - '+.push.apple.com'

### TUN 配置
tun:
  enable: true
  stack: mixed
  # 避免采用巨帧默认值；特殊链路仍需按实际 MTU 调整。
  mtu: 1500
  dns-hijack:
    - 'any:53'
    - 'tcp://any:53'
  udp-timeout: 300
  auto-route: true
  # Linux / Android 可利用 auto-redirect；Windows / macOS 不依赖此项。
  # 保留该字段可让同一份配置在支持的平台获得优化，而不固定平台网卡名。
  auto-redirect: true
  auto-detect-interface: true
  # Windows 可抑制多宿主 DNS 泄漏；Android 同样有利于 DNS 劫持。
  # 若 Windows 上 VirtualBox/特殊虚拟网卡冲突，可单独改为 false。
  strict-route: true

### 订阅健康检查默认值
# 如果使用 proxy-providers，每个实际 provider 都应继承此模板或写入相同 health-check。
# 客户端动态注入的 provider 不会自动继承它，需要在客户端覆写其 health-check。
NodeParam: &NodeParam
  type: http
  interval: 86400
  health-check:
    enable: true
    url: 'https://1.1.1.1/cdn-cgi/trace'
    interval: 30
    timeout: 10000
    lazy: false
    expected-status: '200-299'

# 原文件没有订阅地址；按实际情况启用，勿把占位链接当作有效订阅。
# proxy-providers:
#   订阅1:
#     <<: *NodeParam
#     url: '填入你的真实订阅地址'
#     path: ./proxy_provider/provider1.yaml
#     proxy: DIRECT

### 节点筛选
# 国内只匹配明确的国家标签；CN2、BGP、中转、自建不代表出口在中国大陆。
# 名称仍可能缺标签或标错，“全部自动选择”提供不依赖国家标签的兜底。
FilterInfo: &FilterInfo '(?i)剩余|流量|到期|过期|官网|客服|订阅|返利|邀请|套餐|重置|公告|通知|群组|工单'
FilterGlobal: &FilterGlobal '^(?!.*(?:中国|大陆|🇨🇳|(?i:\bCN\b|\bChina\b|\bMainland\b)))(?!.*(?:[xX×✕*]\s*\d+(?:\.\d+)?|\d+(?:\.\d+)?\s*[xX×✕]|倍率)).*$'
FilterCN: &FilterCN '^(?=.*(?:中国|大陆|🇨🇳|(?i:\bCN\b|\bChina\b|\bMainland\b)))(?!.*(?:[xX×✕*]\s*\d+(?:\.\d+)?|\d+(?:\.\d+)?\s*[xX×✕]|倍率)).*$'
FilterGlobal_Multiplier: &FilterGlobal_Multiplier '^(?!.*(?:中国|大陆|🇨🇳|(?i:\bCN\b|\bChina\b|\bMainland\b)))(?=.*(?:[xX×✕*]\s*\d+(?:\.\d+)?|\d+(?:\.\d+)?\s*[xX×✕]|倍率)).*$'
FilterCN_Multiplier: &FilterCN_Multiplier '^(?=.*(?:中国|大陆|🇨🇳|(?i:\bCN\b|\bChina\b|\bMainland\b)))(?=.*(?:[xX×✕*]\s*\d+(?:\.\d+)?|\d+(?:\.\d+)?\s*[xX×✕]|倍率)).*$'

Select: &Select {type: select, disable-udp: false, hidden: false, include-all: true, exclude-filter: *FilterInfo}
# IP 测试目标避免“测速需要 DNS，而 DNS 又需要测速选出节点”的循环。
# max-failed-times 是触发强制健康检查的连接失败计数，不是测速连续失败重试次数。
Auto: &Auto {type: url-test, url: 'https://1.1.1.1/cdn-cgi/trace', interval: 30, tolerance: 100, timeout: 10000, max-failed-times: 3, expected-status: '200-299', disable-udp: false, lazy: false, hidden: true, include-all: true, exclude-filter: *FilterInfo}
DomesticAuto: &DomesticAuto {<<: *Auto, url: 'https://www.baidu.com', expected-status: '200-399'}

### 策略组
proxy-groups:
  # DNS 始终从所有可用节点自动选择；此组可能使用倍率节点以保证解析可用。
  - {name: DNS自动选择, <<: *Auto, filter: *FilterAll}
  - {name: 全部自动选择, <<: *Auto, filter: *FilterAll, hidden: false}
  - {name: 全部手动选择, <<: *Select}
  # 普通国外组为空、没有普通倍率节点或国家标签不准确时自动兜底。
  # 最后一级全部组可能包含倍率或国内节点，以可达测试目标为准。
  - {name: 国外自动兜底, type: fallback, proxies: [国外自动选择, 国外倍率自动, 全部自动选择], url: 'https://1.1.1.1/cdn-cgi/trace', interval: 30, timeout: 10000, lazy: false, expected-status: '200-299', max-failed-times: 3}
  # === 基础节点分组 ===
  - {name: 国内策略, type: select, proxies: [DIRECT, 国内自动选择, 国内手动选择, 国内倍率自动, 国内倍率手动]}
  - {name: 国内自动选择, <<: *DomesticAuto, filter: *FilterCN}
  - {name: 国内手动选择, <<: *Select, filter: *FilterCN}

  - {name: 国外策略, type: select, proxies: [国外自动兜底, 国外自动选择, 国外手动选择, 国外倍率自动, 国外倍率手动, 全部手动选择, DIRECT]}
  - {name: 国外自动选择, <<: *Auto, filter: *FilterGlobal}
  - {name: 国外手动选择, <<: *Select, filter: *FilterGlobal}

  # === 倍率节点分组 ===
  - {name: 国内倍率自动, <<: *DomesticAuto, filter: *FilterCN_Multiplier}
  - {name: 国内倍率手动, <<: *Select, filter: *FilterCN_Multiplier}
  - {name: 国外倍率自动, <<: *Auto, filter: *FilterGlobal_Multiplier}
  - {name: 国外倍率手动, <<: *Select, filter: *FilterGlobal_Multiplier}

  # 独立策略
  - {name: 独立策略, type: select, proxies: [国内自动选择, 国内手动选择, 国外自动选择, 国外手动选择, 国内倍率自动, 国内倍率手动, 国外倍率自动, 国外倍率手动, DIRECT]}

  # === 应用策略组 ===
  # 隐私组默认直连；需要主动阻断时再选择 REJECT，避免宽泛隐私规则误伤。
  - {name: 📘 GitHub, type: select, proxies: [国外策略, 国内策略]}
  - {name: 🙋 Telegram, type: select, proxies: [国外策略]}
  - {name: 🕊️ Twitter(X), type: select, proxies: [国外策略]}
  - {name: 🗣️ Facebook, type: select, proxies: [国外策略]}
  - {name: 🌳 Amazon, type: select, proxies: [国外策略, 国内策略]}
  - {name: 🍎 Apple, type: select, proxies: [国外策略, 国内策略]}
  - {name: Ⓜ️ Microsoft, type: select, proxies: [国外策略, 国内策略]}
  - {name: 🎮 Steam, type: select, proxies: [国外策略, 国内策略]}
  - {name: 🕹️ Game (Epic), type: select, proxies: [国外策略, 国内策略]}
  - {name: 🕹️ Game (EA), type: select, proxies: [国外策略, 国内策略]}
  - {name: 🎞️ YouTube, type: select, proxies: [国外策略]}
  - {name: 🇬🇴 Google, type: select, proxies: [国外策略, 国内策略]}
  - {name: ➡️ 国内, type: select, proxies: [国内策略]}
  - {name: 🌍 国外, type: select, proxies: [国外策略]}
  - {name: 🔒 隐私, type: select, proxies: [DIRECT, REJECT, 国内策略, 国外策略]}
  - {name: 🐟 漏网之鱼, type: select, proxies: [国外策略, 国内策略, 独立策略, DIRECT]}

### 规则集定义
# MRS 只用于 domain / ipcidr；复杂混合规则继续使用 classical。
# MRS 下载使用 MetaCubeX 官方规则源的 JSDelivr-CF 镜像，避免 rule-provider proxy 的启动循环依赖。
rule-anchor:
  mrs_domain: &mrs_domain {type: http, behavior: domain, format: mrs, interval: 86400, size-limit: 33554432}
  mrs_ip: &mrs_ip {type: http, behavior: ipcidr, format: mrs, interval: 86400, size-limit: 33554432}
  classical_yaml: &classical_yaml {type: http, behavior: classical, format: yaml, interval: 86400, size-limit: 33554432}

### 分流规则
# 顺序原则：私网 > 应用专属 > 国内域名 > 隐私兜底 > 国内 IP > 非中国域名 > 最终兜底
rules:
  # 0. 基础本地规则不依赖远程规则集下载成功。
  - DOMAIN,localhost,DIRECT
  # Windows 联网状态检测走实际直连网络，不依赖国外代理组。
  - DOMAIN,dns.msftncsi.com,DIRECT
  - DOMAIN,www.msftncsi.com,DIRECT
  - DOMAIN,www.msftconnecttest.com,DIRECT
  - DOMAIN-SUFFIX,lan,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,localdomain,DIRECT
  - DOMAIN-SUFFIX,internal,DIRECT
  - DOMAIN-SUFFIX,home.arpa,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve

  # 私有网络直连，避免 LAN / 本机服务误入代理。
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,private_ip,DIRECT,no-resolve

  # 1. 应用域名：MRS 主匹配。
  - RULE-SET,github_domain,📘 GitHub
  - RULE-SET,telegram_domain,🙋 Telegram
  - RULE-SET,twitter_domain,🕊️ Twitter(X)
  - RULE-SET,facebook_domain,🗣️ Facebook
  - RULE-SET,youtube_domain,🎞️ YouTube
  - RULE-SET,amazon_domain,🌳 Amazon
  - RULE-SET,apple_domain,🍎 Apple
  - RULE-SET,microsoft_domain,Ⓜ️ Microsoft
  - RULE-SET,google_domain,🇬🇴 Google
  - RULE-SET,steam_domain,🎮 Steam
  - RULE-SET,epic_domain,🕹️ Game (Epic)
  - RULE-SET,ea_domain,🕹️ Game (EA)

  # 2. 有官方专属 IP 集的应用，用 MRS ipcidr 补齐纯 IP 连接。
  - RULE-SET,telegram_ip,🙋 Telegram,no-resolve
  - RULE-SET,twitter_ip,🕊️ Twitter(X),no-resolve
  - RULE-SET,facebook_ip,🗣️ Facebook,no-resolve
  - RULE-SET,google_ip,🇬🇴 Google,no-resolve

  # 3. 中国域名先直连，保持应用专属策略拥有更高优先级。
  - RULE-SET,cn_domain,➡️ 国内

  # 4. 隐私规则采用“快速域名 MRS + Classical 复杂规则兜底”。
  # tracker_domain 来自 MetaCubeX tracker；Privacy_Classical 保留 DOMAIN/IP/其他 classical 能力。
  - RULE-SET,tracker_domain,🔒 隐私
  - RULE-SET,privacy_classical,🔒 隐私

  # 5. 中国 IP 直连；no-resolve 避免为纯规则匹配触发额外 DNS。
  - RULE-SET,cn_ip,➡️ 国内,no-resolve

  # 6. 非中国域名统一国外策略，替代旧 Global + Global_Domain 两套大列表。
  - RULE-SET,geolocation_non_cn,🌍 国外

  # 7. 无法归类的连接保留人工可控兜底。
  - MATCH,🐟 漏网之鱼

