FilterGlobal_Multiplier: &FilterGlobal_Multiplier '^(?=.*(?:香港|澳门|台湾|日本|韩国|新加坡|美国|英国|德国|法国|荷兰|印度|罗马|悉尼|澳大利亚|澳洲|加拿大|俄罗斯|土耳其|巴西|阿根廷|南非|泰国|越南|菲律宾|马来西亚|印尼|印度尼西亚|瑞士|瑞典|挪威|芬兰|丹麦|意大利|西班牙|葡萄牙|波兰|乌克兰|以色列|阿联酋|迪拜|新西兰|墨西哥|爱尔兰|奥地利|比利时|捷克|匈牙利|罗马尼亚|希腊|冰岛|卢森堡|柬埔寨|缅甸|巴基斯坦|孟加拉|尼泊尔|斯里兰卡|沙特|埃及|尼日利亚|肯尼亚|智利|秘鲁|哥伦比亚|🇭🇰|🇲🇴|🇹🇼|🇯🇵|🇰🇷|🇸🇬|🇺🇸|🇬🇧|🇩🇪|🇫🇷|🇳🇱|🇨🇦|🇦🇺|🇮🇳|(?i:(?<![A-Za-z0-9])(?:HK|Hong[ -]?Kong|MO|Macau|Macao|TW|Taiwan|JP|Japan|KR|Korea|SG|Singapore|US|USA|United[ -]?States|UK|GB|Britain|United[ -]?Kingdom|DE|Germany|FR|France|NL|Netherlands|IN|India|AU|Australia|CA|Canada|RU|Russia|TR|Turkey|BR|Brazil|TH|Thailand|VN|Vietnam|PH|Philippines|MY|Malaysia|ID|Indonesia|CH|Switzerland|SE|Sweden|NO|Norway|FI|Finland|DK|Denmark|IT|Italy|ES|Spain|PT|Portugal|PL|Poland|NZ|New[ -]?Zealand|AE|UAE|Dubai|IE|Ireland|AT|Austria|BE|Belgium|CZ|Czech)(?![A-Za-z0-9]))))(?!.*(?:中国|大陆|🇨🇳|(?i:(?<![A-Za-z0-9])(?:CN|China|Mainland)(?![A-Za-z0-9]))))(?=.*(?:[xX×✕*]\s*\d+(?:\.\d+)?|\d+(?:\.\d+)?\s*[xX×✕]|\d+(?:\.\d+)?\s*倍|倍率)).*$'
FilterCN_Multiplier: &FilterCN_Multiplier '^(?=.*(?:中国|大陆|🇨🇳|(?i:(?<![A-Za-z0-9])(?:CN|China|Mainland)(?![A-Za-z0-9]))))(?=.*(?:[xX×✕*]\s*\d+(?:\.\d+)?|\d+(?:\.\d+)?\s*[xX×✕]|\d+(?:\.\d+)?\s*倍|倍率)).*$'

Select: &Select {type: select, disable-udp: false, hidden: false, include-all: true, exclude-filter: *FilterInfo, empty-fallback: REJECT}
# HTTP 204 检测不依赖内核的 HTTPS 测速行为；DNS 由客户端独立提供。
# max-failed-times 是触发强制健康检查的连接失败计数，不是测速连续失败重试次数。
Auto: &Auto {type: url-test, url: 'http://www.gstatic.com/generate_204', interval: 180, tolerance: 50, timeout: 10000, max-failed-times: 3, expected-status: '204', disable-udp: false, lazy: false, hidden: true, include-all: true, exclude-filter: *FilterInfo, empty-fallback: REJECT}
DomesticAuto: &DomesticAuto {<<: *Auto, url: 'https://www.baidu.com', expected-status: '200-399'}
Fallback: &Fallback {type: fallback, url: 'http://www.gstatic.com/generate_204', interval: 180, timeout: 10000, lazy: false, expected-status: '204', max-failed-times: 3, empty-fallback: REJECT}

### 策略组
proxy-groups:
  - {name: 全部自动选择, <<: *Auto, filter: *FilterAll, lazy: true, hidden: false}
  - {name: 全部手动选择, <<: *Select}
  # 国外兜底仅在普通与倍率国外组之间切换，不经混合组引入国内节点。
  - {name: 国外自动兜底, <<: *Fallback, proxies: [国外自动选择, 国外倍率自动]}
  # === 基础节点分组 ===
  - {name: 国内策略, type: select, proxies: [DIRECT, 国内自动选择, 国内手动选择, 国内倍率自动, 国内倍率手动]}
  - {name: 国内自动选择, <<: *DomesticAuto, filter: *FilterCN}
  - {name: 国内手动选择, <<: *Select, filter: *FilterCN}

  - {name: 国外策略, type: select, proxies: [国外自动兜底, 国外自动选择, 国外手动选择, 国外倍率自动, 国外倍率手动, 全部手动选择, DIRECT]}
  - {name: 国外自动选择, <<: *Auto, filter: *FilterGlobal}
  - {name: 国外手动选择, <<: *Select, filter: *FilterGlobal}

  # === 倍率节点分组 ===
  - {name: 国内倍率自动, <<: *DomesticAuto, filter: *FilterCN_Multiplier}
  - {name: 国内倍率手动, <<: *Select, filter: *FilterCN_Multiplier}
  - {name: 国外倍率自动, <<: *Auto, filter: *FilterGlobal_Multiplier}
  - {name: 国外倍率手动, <<: *Select, filter: *FilterGlobal_Multiplier}

  # 独立策略
  - {name: 独立策略, type: select, proxies: [国内自动选择, 国内手动选择, 国外自动选择, 国外手动选择, 国内倍率自动, 国内倍率手动, 国外倍率自动, 国外倍率手动, DIRECT]}

  # === 应用策略组 ===
  # 隐私组默认遵循国外策略；用户仍可手动选择直连或阻断。
  - {name: 📘 GitHub, type: select, proxies: [国外策略, 国内策略]}
  - {name: 🙋 Telegram, type: select, proxies: [国外策略]}
  - {name: 🕊️ Twitter(X), type: select, proxies: [国外策略]}
  - {name: 🗣️ Facebook, type: select, proxies: [国外策略]}
  - {name: 🌳 Amazon, type: select, proxies: [国外策略, 国内策略]}
  - {name: 🍎 Apple, type: select, proxies: [国外策略, 国内策略]}
  - {name: Ⓜ️ Microsoft, type: select, proxies: [国外策略, 国内策略]}
  - {name: 🎮 Steam, type: select, proxies: [国外策略, 国内策略]}
  - {name: 🕹️ Game (Epic), type: select, proxies: [国外策略, 国内策略]}
  - {name: 🕹️ Game (EA), type: select, proxies: [国外策略, 国内策略]}
  - {name: 🎞️ YouTube, type: select, proxies: [国外策略]}
  - {name: 🇬🇴 Google, type: select, proxies: [国外策略, 国内策略]}
  - {name: ➡️ 国内, type: select, proxies: [国内策略]}
  - {name: 🌍 国外, type: select, proxies: [国外策略]}
  - {name: 🔒 隐私, type: select, proxies: [国外策略, DIRECT, REJECT, 国内策略]}
  - {name: 🐟 漏网之鱼, type: select, proxies: [国外策略, 国内策略, 独立策略, DIRECT]}

### 规则集定义
# MRS 只用于 domain / ipcidr；复杂混合规则继续使用 classical。
# MRS 下载使用 MetaCubeX 官方规则源的 JSDelivr-CF 镜像，避免 rule-provider proxy 的启动循环依赖。
rule-anchor:
  mrs_domain: &mrs_domain {type: http, behavior: domain, format: mrs, interval: 86400, size-limit: 33554432}
  mrs_ip: &mrs_ip {type: http, behavior: ipcidr, format: mrs, interval: 86400, size-limit: 33554432}
  classical_yaml: &classical_yaml {type: http, behavior: classical, format: yaml, interval: 86400, size-limit: 33554432}

### 分流规则
# 顺序原则：本地 > 明确域名 > 隐私 > 应用 IP > 国内 IP > 最终兜底
rules:
  # 0. 基础本地规则不依赖远程规则集下载成功。
  - DOMAIN,localhost,DIRECT
  # Windows 联网状态检测走实际直连网络，不依赖国外代理组。
  - DOMAIN,dns.msftncsi.com,DIRECT
  - DOMAIN,www.msftncsi.com,DIRECT
  - DOMAIN,www.msftconnecttest.com,DIRECT
  - DOMAIN-SUFFIX,lan,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,localdomain,DIRECT
  - DOMAIN-SUFFIX,internal,DIRECT
  - DOMAIN-SUFFIX,home.arpa,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve

  # 私有网络直连，避免 LAN / 本机服务误入代理。
  - RULE-SET,private_domain,DIRECT
  # 已知 AI 域名优先于 IP 规则，防止异常地址将其归入其他服务。
  - DOMAIN-SUFFIX,chatgpt.com,🌍 国外
  - DOMAIN-SUFFIX,openai.com,🌍 国外
  - DOMAIN-SUFFIX,oaistatic.com,🌍 国外
  - DOMAIN-SUFFIX,oaiusercontent.com,🌍 国外
  - DOMAIN-SUFFIX,claude.ai,🌍 国外
  - DOMAIN-SUFFIX,anthropic.com,🌍 国外
  # 映射丢失的旧假地址立即失败，避免落入私网直连后等待超时。
  - IP-CIDR,198.18.0.0/15,REJECT,no-resolve
  - RULE-SET,private_ip,DIRECT,no-resolve

  # 1. 应用域名：MRS 主匹配。
  - RULE-SET,github_domain,📘 GitHub
  - RULE-SET,telegram_domain,🙋 Telegram
  - RULE-SET,twitter_domain,🕊️ Twitter(X)
  - RULE-SET,facebook_domain,🗣️ Facebook
  - RULE-SET,youtube_domain,🎞️ YouTube
  - RULE-SET,amazon_domain,🌳 Amazon
  - RULE-SET,apple_domain,🍎 Apple
  - RULE-SET,microsoft_domain,Ⓜ️ Microsoft
  - RULE-SET,google_domain,🇬🇴 Google
  - RULE-SET,steam_domain,🎮 Steam
  - RULE-SET,epic_domain,🕹️ Game (Epic)
  - RULE-SET,ea_domain,🕹️ Game (EA)

  # 3. 中国域名先直连，保持应用专属策略拥有更高优先级。
  - RULE-SET,cn_domain,➡️ 国内

  # 4. 隐私规则采用“快速域名 MRS + Classical 复杂规则兜底”。
  # tracker_domain 来自 MetaCubeX tracker；Privacy_Classical 保留 DOMAIN/IP/其他 classical 能力。
  - RULE-SET,tracker_domain,🔒 隐私
  - RULE-SET,privacy_classical,🔒 隐私

  # 明确的国外域名先于 IP 判断，避免缓存中的异常地址改变分流。
  - RULE-SET,geolocation_non_cn,🌍 国外

  # 纯 IP 连接再使用应用 IP 集补齐。
  - RULE-SET,telegram_ip,🙋 Telegram,no-resolve
  - RULE-SET,twitter_ip,🕊️ Twitter(X),no-resolve
  - RULE-SET,facebook_ip,🗣️ Facebook,no-resolve
  - RULE-SET,google_ip,🇬🇴 Google,no-resolve

  # 5. 中国 IP 直连；no-resolve 避免为纯规则匹配触发额外 DNS。
  - RULE-SET,cn_ip,➡️ 国内,no-resolve

  # 7. 无法归类的连接保留人工可控兜底。
  - MATCH,🐟 漏网之鱼

